<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Next-to-X</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- Pannello impostazioni (slide da destra) -->
<div id="options-panel">
  <div id="options-header">
    <span>Impostazioni</span>
    <button id="options-close">✕</button>
  </div>
  <label class="setting-row">
    <span class="setting-label">Simula posizione</span>
    <input type="checkbox" id="toggleDebug" class="toggle-input" />
    <span class="toggle-track"></span>
  </label>
  <div id="csv-debug-section" hidden>
    <p class="setting-hint">Traccia GPS (CSV)</p>
    <input type="file" id="csvInput" accept=".csv" />
    <div id="csvStatus"></div>
  </div>
  <label class="setting-row">
    <span class="setting-label">Mostra tutte le stazioni</span>
    <input type="checkbox" id="toggleNearest" class="toggle-input" />
    <span class="toggle-track"></span>
  </label>
</div>

<!-- Mappa con overlay HUD -->
<div id="map-wrapper">
  <div id="hud-top">
    <div id="strada">🛣️</div>
    <div id="direzione">🧭</div>
    <button id="options-toggle" aria-label="Impostazioni">⚙</button>
  </div>
  <div id="map"></div>
  <div id="next-station">
    <span class="next-station-info">–</span>
  </div>
</div>

<!-- Pannello inferiore -->
<div id="bottom-panel">
  <div id="distance-bar-container">
    <div class="bar-posizione" aria-hidden="true">
      <svg viewBox="0 0 24 24"><polygon points="12,1 22,23 12,18 2,23" fill="#3b9eff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" /></svg>
    </div>
    <div id="distance-bar"></div>
  </div>
  <button id="stations-toggle-btn">
    <span id="stations-count-label">Stazioni nelle vicinanze</span>
    <span id="stations-chevron">▼</span>
  </button>
  <div id="stations-list" hidden>
    <table id="stations-table">
      <thead>
        <tr>
          <th>Area</th>
          <th>Strada</th>
          <th class="th-dist">km</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module" src="js/app/main.js"></script>
</body>
</html>
